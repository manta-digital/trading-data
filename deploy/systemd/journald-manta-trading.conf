# /etc/systemd/journald.conf.d/manta-trading.conf
#
# Caps journald disk usage so a runaway-log bug in either daemon
# (slice 128) cannot fill the host disk. Values per slice 126's design:
# 2 GiB total, 200 MiB per file. Safe to install host-wide because
# journald limits are per-namespace and this host runs only the trading
# stack.

[Journal]
SystemMaxUse=2G
SystemMaxFileSize=200M
