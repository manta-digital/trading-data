# deploy/backup-clusters.conf — the PostgreSQL clusters the backup tier covers
# (slice 227, TD2). One row per cluster; fields separated by any run of spaces
# or tabs. Read by deploy/lib/backup_clusters.sh (setup-backup.sh, cron render)
# and scripts/backup_clusters.py (cutover, restore drill). Both parsers apply
# the same rules; a malformed row is a hard error, never skipped.
#
# Columns:
#   cluster           <version>/<name> as pg_lsclusters lists it
#   url_key           env-file key holding the cluster's maintenance URL (MT_...)
#   backup_root       absolute, under /data: holds base/ wal/ metadata/, the
#                     cluster's logs, stamps, flags and arm file
#   remote_subpath    sub-prefix under b2:<bucket>; `-` = the bucket root
#                     (production's prefixes, which never move: TD3)
#   replication_host  host that replaces the URL's host for pg_basebackup;
#                     `-` = use the URL as written
#   metadata_cron     five cron fields for the nightly metadata dump
#   weekly_base_cron  five cron fields for the weekly base backup
#
# cluster  url_key                       backup_root          remote_subpath  replication_host  metadata_cron  weekly_base_cron
17/main    MT_TIMESCALE_MAINTENANCE_URL  /data/backup         -               127.0.0.1         0 2 * * *      0 3 * * 0
17/tick    MT_TICK_MAINTENANCE_URL       /data/backup/17-tick 17-tick         -                 15 2 * * *     30 2 * * 0
