# /etc/postgresql/17/<cluster>/conf.d/917-test-cluster.conf
#
# Settings for the dedicated test-database cluster (slice 917) on hammerhead.
# Dropped into conf.d rather than editing postgresql.conf, matching the pattern
# slice 915 established with 915-archiving.conf on production.
#
# NEVER install this on the production cluster. It is sized for ephemeral test
# databases, not for a 142 GB hypertable.

# --- TimescaleDB ------------------------------------------------------------
# Non-negotiable. Migrations create hypertables and continuous aggregates, and
# test_policy_advances_head.py waits on the real background scheduler rather
# than calling run_job(). A cluster with zero background workers turns those
# nine passing tests into hangs that read as test bugs rather than as a
# configuration problem.
shared_preload_libraries = 'timescaledb'
timescaledb.max_background_workers = 8

# --- Network ----------------------------------------------------------------
# Bind all interfaces; access control is enforced in pg_hba.conf, which admits
# exactly one source host. Binding a literal address instead would make the
# cluster fail to start if the host's IP ever changed, and would not add
# security that pg_hba is not already providing.
listen_addresses = '*'

# --- Sizing -----------------------------------------------------------------
# Worst case roughly 15 GiB of hammerhead's 62 GiB, leaving the interactive
# workload comfortable.
#
# work_mem is deliberately NOT production parity. Production runs 512MB, a 50x
# override of what timescaledb-tune recommended, and separately suspect.
# Copying a value we believe is wrong is not parity, it is propagation. Plan
# shape is not what these tests assert.
shared_buffers = 8GB
work_mem = 64MB
maintenance_work_mem = 512MB
max_connections = 100
max_worker_processes = 16
